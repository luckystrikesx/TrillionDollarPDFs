<script>
/* ═══ EDIT ZONE 2 — every word on the page ═══════════════════════════════ */
const SITE = {
wordmark: "Trillion $$ PDFs", // small mark, top left
headline: "Trillion $$ PDFs", // the big line
subhead: "PSYOP edition", // small mono block under it — "" to hide
description: "An open index of foundational texts and blueprints that shaped how we understand human behavior, machine intelligence, incentive structures, and narrative control — browse it below and follow the link to read the original.",
highlight: "human behavior, machine intelligence, incentive structures, and narrative control", // sulphur underline; must appear verbatim above, or ""
weeklyUrl: "https://psyopweekly.substack.com/", // drives the panel and the cross-references
warning: "Do not click this", // repeated down the panel, redacted line by line
warningAria: "Read PSYOPWeekly", // what a screen reader announces instead of the repetition
submitLabel: "Suggest a document →",
submitEmail: "hello@example.com",
footerLine: "Trillion $$ PDFs (PSYOP edition)"
};

/* One object per entry, oldest first. Lot numbers follow this order.
t = title a = author y = year
u = link to the original ("" shows no link)
d = the one-line thesis n = the note behind "Open +"
x = optional cross-reference to the Weekly, shown inside the note */
const ENTRIES = [
{t:"The Code of Hammurabi", a:"King Hammurabi (Trans. L.W. King)", y:"c. 1750 BCE", u:"https://www.general-intelligence.com/library/hr.pdf",
d:"One of the oldest deciphered writings of significant length in the world, establishing the concept of justice and laws through 'an eye for an eye'.",
n:"While not a modern psychological text, it is a foundational document in human behavior modification, establishing clear legal boundaries and state-enforced consequences for actions."},
{t:"The Beauty Contest", a:"John Maynard Keynes", y:1936, u:"https://www.mkwinc.com/wp-content/uploads/2015/09/Keyness-Beauty-Contest.pdf",
d:"Markets are driven not by fundamental value, but by what people think other people think the value is.",
n:"A core concept from 'The General Theory of Employment, Interest and Money' explaining speculative bubbles and meta-level reasoning. We are all just trying to guess what average opinion expects average opinion to be."},
{t:"Simple Sabotage Field Manual", a:"Office of Strategic Services (OSS)", y:1944, u:"https://regmedia.co.uk/2021/01/05/simple_sabotage_field_manual.pdf",
d:"A guide on how to subtly disrupt organizations and systems from within through bureaucratic friction and malicious compliance.",
n:"Declassified WWII document. The section on 'General Interference with Organizations' describes most modern corporate meetings perfectly."},
{t:"The Sect of the Phoenix", a:"Jorge Luis Borges", y:1952, u:"https://2500art.wordpress.com/wp-content/uploads/2014/02/sect-of-the-phoenix.pdf",
d:"A hidden, ubiquitous secret unites all of humanity through an unspoken, mundane, and instinctive ritual.",
n:"An extended riddle disguised as a parable about a mysterious global cult whose universal secret is simply the instinctual act of human procreation."},
{t:"Letter to Hume Logan", a:"Hunter S. Thompson", y:1958, u:"https://fs.blog/hunter-s-thompson-to-hume-logan/",
d:"A philosophical masterclass on why a person should not strive to fit a predetermined goal, but mold the goal to fit their own nature.",
n:"Written when Thompson was just 20 years old, it perfectly articulates the existential difference between 'being' and 'doing' when choosing a path in life."},
{t:"Playboy Interview: Miles Davis", a:"Alex Haley", y:1962, u:"https://www.erenkrantz.com/Music/MilesDavisInterview.shtml",
d:"A fiercely unfiltered conversation about race, the relentless pursuit of artistic evolution, and refusing to compromise.",
n:"The inaugural Playboy Interview. Davis lays bare the psychology of a musical genius who continuously reinvented his art form rather than resting on past successes."},
{t:"Learned Helplessness: Theory and Evidence", a:"Martin E.P. Seligman", y:1972, u:"https://ppc.sas.upenn.edu/sites/default/files/learnedhelplessness.pdf",
d:"When animals or humans are conditioned to expect pain with no escape, they stop trying to avoid it.",
n:"A foundational psychology paper on conditioning and passivity, which later led Seligman to pivot entirely towards Positive Psychology."},
{t:"Influence: The Psychology of Persuasion (Summary)", a:"Robert B. Cialdini", y:1984, u:"https://public.summaries.com/files/8-page-summary/influence.pdf",
d:"The six shortcuts of persuasion that compliance professionals fire on purpose.",
n:"A concise summary of Cialdini's seminal work on reciprocity, commitment, social proof, liking, authority, and scarcity."},
{t:"Personal Renewal", a:"John W. Gardner", y:1990, u:"https://gsb-courses.stanford.edu/building-innovative-brands/wp-content/uploads/sites/25/2022/04/johngardner-roadtoself-renewal2.pdf",
d:"An exploration of why some individuals decay into staleness while others maintain vitality and curiosity throughout their lives.",
n:"Originally delivered as a speech to McKinsey & Company, it identifies the key traps of mid-career success and how to systemize lifelong learning and reinvention."},
{t:"MIT Guide to Lock Picking", a:"Ted the Tool", y:1991, u:"https://www.lysator.liu.se/mit-guide/MITLockGuide.pdf",
d:"A mechanical explanation of how locks work and how they can be systematically defeated.",
n:"One of the most famous early internet texts on physical security. It teaches a mindset: systems designed to keep people out are just logical puzzles."},
{t:"Blood Meridian as Gnostic Tragedy", a:"Leo Daugherty", y:1992, u:"https://escholarship.org/content/qt5kw8f77n/qt5kw8f77n_noSplash_c03e51aa9031a015630f5b7bfa32ea15.pdf",
d:"An examination of Cormac McCarthy's masterpiece through the framework of Gnosticism, where the material world is inherently evil.",
n:"Analyzes the brutal, deterministic world of Blood Meridian and the archon-like figure of Judge Holden. Daugherty argues that the violence is not senseless, but deeply rooted in Gnostic theology."},
{t:"The Psychology of Human Misjudgment", a:"Charlie Munger", y:1995, u:"https://neilhacker.com/wp-content/uploads/2020/02/human-misjudgement-copy.pdf",
d:"A masterclass on the cognitive biases that lead individuals to make terrible decisions.",
n:"Originally a speech at Harvard, this is the practical inversion of behavioral economics from a billionaire investor."},
{t:"The Ecology of Fear", a:"Joel S. Brown", y:1999, u:"https://gwern.net/doc/cat/psychology/1999-brown.pdf",
d:"How the psychological landscape of fear dictates the behavior, feeding habits, and survival strategies of prey animals.",
n:"A foundational paper in behavioral ecology showing that the mere presence of predators (the 'ecology of fear') impacts ecosystems just as much as actual predation."},
{t:"Information Theory, Inference, and Learning Algorithms", a:"David J.C. MacKay", y:2003, u:"https://assets.cambridge.org/97805218/26518/sample/9780521826518ws.pdf",
d:"An elegant mathematical framework uniting Claude Shannon's communication theory with Bayesian inference and machine learning.",
n:"Long before the deep learning boom, this legendary textbook proved that data compression, error correction, and artificial neural networks are all facets of the exact same mathematical reality."},
{t:"The World's Largest Hedge Fund is a Fraud", a:"Harry Markopolos", y:2005, u:"https://www.sec.gov/news/studies/2009/oig-509/exhibit-0293.pdf",
d:"The meticulously ignored whistleblowing memo that proved mathematically that Bernie Madoff’s returns were impossible.",
n:"A masterclass in forensic accounting and systemic blindness. It details exact red flags showing how Madoff was running a pure Ponzi scheme years before it collapsed."},
{t:"This Is Water", a:"David Foster Wallace", y:2005, u:"https://farmamol.web.uah.es/This_is_Water.pdf",
d:"The exact nature of the default setting of our minds, and how to transcend it.",
n:"Originally a commencement speech at Kenyon College. A foundational text on choosing what to pay attention to in mundane, adult life."},
{t:"The Secret Tesla Motors Master Plan", a:"Elon Musk", y:2006, u:"https://www.tesla.com/en_in/secret-master-plan",
d:"Build sports car; use that money to build an affordable car; use that money to build an even more affordable car; provide zero emission power.",
n:"A classic essay on strategic roadmap transparency and narrative positioning, reframing electric vehicle manufacturing from a niche gimmick into an inevitable stepped capital deployment plan."},
{t:"Escaping the Laboratory", a:"Edmund Ramsden & Jon Adams", y:2009, u:"https://joeornstein.github.io/pols-4641/readings/Ramsden%20and%20Adams%20-%202009%20-%20Escaping%20the%20Laboratory%20The%20Rodent%20Experiments%20of.pdf",
d:"A deep dive into the infamous 'Universe 25' mouse utopia experiments and their cultural impact.",
n:"Shows how population density and 'behavioral sinks' became a prevailing narrative in 20th-century sociology and urban planning."},
{t:"On the Absolute, the Sublime, and Ecstatic Truth", a:"Werner Herzog", y:2010, u:"https://www.bu.edu/arion/files/2010/03/Herzog.pdf",
d:"A manifesto on why facts do not constitute truth, and why the deeper strata of truth must be reached through poetic fabrication.",
n:"Delivered as a rogue declaration. It explains his entire filmmaking philosophy and why he frequently alters reality to achieve 'ecstatic truth'."},
{t:"Facebook's Little Red Book", a:"Ben Barry / Facebook", y:2012, u:"https://drive.google.com/file/d/1TZYqdFOXkZZPpMJx_16YBFkw-jaPbxiS/view",
d:"An internal corporate handbook on hacking, building fast, and maintaining a disruptive startup mentality at massive scale.",
n:"Given to new employees during Facebook's prime. It acts as both propaganda and a genuinely effective distillation of engineering culture and aggressive risk-taking."},
{t:"Meditations On Moloch", a:"Scott Alexander", y:2014, u:"https://slatestarcodex.com/2014/07/30/meditations-on-moloch/",
d:"Multipolar traps and coordination failures force rational individual actors into destructive, race-to-the-bottom arms races.",
n:"A landmark essay in modern rationalist discourse using game theory and Allen Ginsberg's 'Moloch' metaphor to explain systemic incentives that ruin human flourishing."},
{t:"Self-Fulfilling Prophesies", a:"Alia Crum & Damon J. Phillips", y:2015, u:"https://www.researchgate.net/publication/299865216_Self-Fulfilling_Prophesies_Placebo_Effects_and_the_Social-Psychological_Creation_of_Reality",
d:"How top-down expectations, mindset, and social influence directly alter physical reality and bodily physiology.",
n:"An interdisciplinary synthesis connecting psychology, sociology, and medicine to prove that belief physically modulates outcomes."},
{t:"6 Secrets of Mental Toughness From the Navy SEALs", a:"Sport Ngin", y:2015, u:"https://cdn1.sportngin.com/attachments/document/748b-2136103/6_Secrets_of_Mental_Toughness_From_the_Navy_SEALs.pdf",
d:"Actionable strategies for maintaining psychological resilience in extreme stress environments.",
n:"Focuses on compartmentalization, visualization, and micro-goals to bypass the brain's innate panic responses."},
{t:"Attention Is All You Need", a:"Ashish Vaswani et al.", y:2017, u:"https://arxiv.org/abs/1706.03762",
d:"Replacing recurrent networks entirely with self-attention mechanisms unlocks massive parallelization and modern generative AI.",
n:"The foundational paper introducing the Transformer architecture, completely shifting the trajectory of compute, machine intelligence, and modern technological narrative."},
{t:"How to Do Great Work", a:"Paul Graham", y:2023, u:"https://www.paulgraham.com/greatwork.html",
d:"A comprehensive framework for cultivating obsessive curiosity, identifying deep problems, and compounding your efforts over decades.",
n:"A distillation of everything PG learned from observing elite founders. The core thesis: great work happens at the intersection of natural aptitude, deep interest, and relentless execution."}
];
/* ═══ END EDIT ZONE 2 — nothing below here needs touching ════════════════ */
</script>
<style>
/* Change these six and the whole page follows. */
:root{
--field:#D5D3C6; /* kraft paper */
--bone:#E4E2D6; /* card surface */
--soil:#16180F; /* ink */
--drab:#4C5340; /* olive drab, secondary */
--sulphur:#C6D82F; /* marking spray accent */
--rule:1px solid var(--soil);
--mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
--cond:"IBM Plex Sans Condensed", "Helvetica Neue", Arial, sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
margin:0; background:var(--field); color:var(--soil);
font-family:var(--mono); font-size:14px; line-height:1.5;
background-image:
linear-gradient(to right, rgba(22,24,15,.055) 1px, transparent 1px),
linear-gradient(to bottom, rgba(22,24,15,.055) 1px, transparent 1px);
background-size:34px 34px;
}
.wrap{max-width:1180px; margin:0 auto; padding:0 20px}
a{color:inherit}
/* ── header ── */
header{border-bottom:var(--rule); background:var(--field)}
.bar{display:flex; align-items:center; gap:20px; min-height:46px;
font-size:11px; letter-spacing:.14em; text-transform:uppercase}
.mark{font-weight:600; display:flex; align-items:center; gap:8px}
.mark i{width:9px; height:9px; background:var(--sulphur); display:block; flex:none}
nav{margin-left:auto; display:flex; gap:18px}
nav a{text-decoration:none; padding-bottom:2px; border-bottom:1px solid transparent}
nav a:hover, nav a:focus-visible{border-bottom-color:var(--soil)}
/* ── hero ── */
.hero{padding:64px 0 8px}
h1{font-family:var(--cond); font-weight:700; margin:0;
font-size:clamp(44px,11.6vw,130px); line-height:.92; letter-spacing:-.03em}
.subhead{display:flex; align-items:center; gap:18px; margin:20px 0 0}
.subhead b{font-family:var(--mono); font-weight:600; background:var(--soil); color:var(--field);
font-size:clamp(14px,2.1vw,21px); letter-spacing:.1em; padding:8px 15px 9px; white-space:nowrap}
.subhead i{flex:1; height:1px; background:var(--soil); min-width:20px}
.lede{font-family:var(--cond); font-size:19px; line-height:1.42; max-width:56ch; margin:26px 0 0}
.lede b{font-weight:600; box-shadow:inset 0 -.42em 0 rgba(198,216,47,.55)}
/* ── index bar ── */
.filters{border-top:var(--rule); border-bottom:var(--rule); margin-top:46px; padding:11px 0;
position:sticky; top:0; background:var(--field); z-index:5;
display:flex; align-items:center; flex-wrap:wrap; gap:8px 16px}
.count{font-size:11px; letter-spacing:.14em; color:var(--drab); text-transform:uppercase}
button{font:inherit; color:inherit; background:none; border:0; cursor:pointer}
.views{margin-left:auto; display:flex; gap:8px}
.toggle{font-size:11px; letter-spacing:.1em; text-transform:uppercase; border:var(--rule); padding:3px 9px}
.toggle[aria-pressed="true"]{background:var(--soil); color:var(--field)}
.toggle:focus-visible, .expand:focus-visible{outline:2px solid var(--soil); outline-offset:3px}
/* ── the index ── */
.plots{display:grid; gap:1px; background:var(--soil); border:var(--rule); border-top:0; margin-bottom:56px}
@media(min-width:640px){.plots{grid-template-columns:repeat(2,1fr)}}
@media(min-width:980px){.plots{grid-template-columns:repeat(3,1fr)}}
.plots.list{grid-template-columns:1fr !important}
.lot{background:var(--bone); padding:18px 18px 16px; display:flex; flex-direction:column;
border-left:3px solid transparent}
.lot:hover{border-left-color:var(--sulphur)}
.lot .no{font-size:10px; letter-spacing:.18em; color:var(--drab); display:flex; justify-content:space-between}
.lot h2{font-family:var(--cond); font-weight:600; font-size:23px; line-height:1.14;
margin:14px 0 0; letter-spacing:-.005em}
.lot h2 a{text-decoration:none; border-bottom:2px solid transparent}
.lot h2 a:hover{border-bottom-color:var(--sulphur)}
.thesis{font-family:var(--cond); font-size:15.5px; line-height:1.44; color:#2C3122; margin:9px 0 0}
.meta{margin-top:auto; padding-top:18px; display:flex; align-items:flex-end; justify-content:space-between; gap:12px}
.who{font-size:11px; letter-spacing:.06em; color:var(--drab); text-transform:uppercase}
.expand{font-size:10px; letter-spacing:.16em; text-transform:uppercase;
border-bottom:1px solid var(--soil); padding-bottom:1px; flex:none}
.note{display:none; font-family:var(--cond); font-size:15px; line-height:1.5;
border-top:1px dashed var(--drab); margin-top:14px; padding-top:12px; color:#2C3122}
.lot.open{background:var(--field)}
.lot.open .note{display:block}
.xref{font-family:var(--mono); font-size:11px; line-height:1.6; color:var(--drab); margin:14px 0 0}
.read{display:inline-block; margin-top:12px; font-size:10px; letter-spacing:.16em;
text-transform:uppercase; text-decoration:none; border-bottom:1px solid var(--soil)}
a.w{text-decoration:none; color:var(--soil); border-bottom:2px solid var(--sulphur); white-space:nowrap}
a.w:hover{background:var(--sulphur)}
.plots.list .lot{display:grid; grid-template-columns:64px 1fr; gap:0 18px; align-items:start}
.plots.list .no{flex-direction:column; gap:4px; grid-row:1/span 4}
.plots.list h2{margin-top:0}
.plots.list .meta{padding-top:12px}
/* ── the panel ── */
.warning{display:block; text-decoration:none; color:var(--field); background:var(--soil);
border:var(--rule); margin:0 0 56px; overflow:hidden}
.warning .inner{padding:clamp(38px,5.4vw,68px) clamp(22px,5vw,54px)}
.warning .ln{position:relative; font-family:var(--cond); font-weight:700; text-transform:uppercase;
font-size:clamp(29px,7.1vw,92px); line-height:1.02; letter-spacing:-.032em;
white-space:nowrap; overflow:hidden}
.warning .ln i{position:absolute; top:2%; bottom:2%; background:var(--soil); transform-origin:left center}
.warning:hover, .warning:focus-visible{background:var(--sulphur); color:var(--soil)}
.warning:hover .ln i, .warning:focus-visible .ln i{transform:scaleX(0)}
.warning:focus-visible{outline:3px solid var(--soil); outline-offset:3px}
footer{border-top:var(--rule); padding:26px 0 50px; font-size:11px; letter-spacing:.1em;
text-transform:uppercase; color:var(--drab); display:flex; flex-wrap:wrap; gap:6px 22px}
footer a{text-decoration:none; border-bottom:1px solid var(--drab)}
footer a:hover{color:var(--soil); border-bottom-color:var(--soil)}
@media(prefers-reduced-motion:no-preference){
.lot{animation:rise .45s ease both}
@keyframes rise{from{opacity:0; transform:translateY(7px)} to{opacity:1; transform:none}}
.warning{transition:background .16s ease, color .16s ease}
.warning .ln i{transition:transform .44s cubic-bezier(.2,.85,.25,1)}
}
</style>
</head>
<body>
<header>
<div class="wrap bar">
<span class="mark"><i></i><span id="s-wordmark"></span></span>
<nav>
<a href="#index">Index</a>
<a href="#submit">Submit</a>
</nav>
</div>
</header>
<main class="wrap">
<section class="hero">
<h1 id="s-headline"></h1>
<div class="subhead"><b id="s-subhead"></b><i></i></div>
<p class="lede" id="s-description"></p>
</section>
<div class="filters" id="index">
<span class="count" id="count"></span>
<div class="views">
<button class="toggle" id="v-grid" aria-pressed="true">Grid</button>
<button class="toggle" id="v-list" aria-pressed="false">List</button>
</div>
</div>
<section class="plots" id="plots"></section>
<a class="warning" id="s-warning" href="https://psyopweekly.substack.com/" target="_blank" rel="noopener"></a>
<footer id="submit"></footer>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* ── hero ── */
$("s-wordmark").textContent = SITE.wordmark;
$("s-headline").textContent = SITE.headline;
if(SITE.subhead) $("s-subhead").textContent = SITE.subhead;
else document.querySelector(".subhead").remove();
$("s-description").innerHTML = SITE.highlight
? esc(SITE.description).replace(esc(SITE.highlight), "<b>"+esc(SITE.highlight)+"</b>")
: esc(SITE.description);
/* ── the index ── */
$("count").textContent = ENTRIES.length + " documents";
$("plots").innerHTML = ENTRIES.map((e,i)=>{
const link = t => `<a href="${esc(e.u)}" target="_blank" rel="noopener">${t}</a>`;
return `
<article class="lot" style="animation-delay:${i*28}ms">
<div class="no"><span>LOT ${String(i+1).padStart(2,"0")}</span><span>SOWN ${esc(e.y)}</span></div>
<h2>${e.u ? link(esc(e.t)) : esc(e.t)}</h2>
<p class="thesis">${esc(e.d)}</p>
<div class="meta">
<span class="who">${esc(e.a)}</span>
<button class="expand" aria-expanded="false" aria-controls="note-${i}">Open +</button>
</div>
<div class="note" id="note-${i}">
<p style="margin:0">${esc(e.n)}</p>
${e.x ? `<p class="xref">${esc(e.x)} <a class="w" href="${esc(SITE.weeklyUrl)}" target="_blank" rel="noopener">Read it in the Weekly →</a></p>` : ""}
${e.u ? `<a class="read" href="${esc(e.u)}" target="_blank" rel="noopener">Read the original →</a>` : ""}
</div>
</article>`;
}).join("");
$("plots").querySelectorAll(".expand").forEach(btn=>{
btn.onclick = ()=>{
const open = btn.closest(".lot").classList.toggle("open");
btn.textContent = open ? "Close −" : "Open +";
btn.setAttribute("aria-expanded", open);
};
});
const g = $("v-grid"), l = $("v-list");
const view = isList => {
$("plots").classList.toggle("list", isList);
g.setAttribute("aria-pressed", !isList);
l.setAttribute("aria-pressed", isList);
};
g.onclick = ()=>view(false);
l.onclick = ()=>view(true);
/* ── the panel: [left%, width%] of each bar, row by row.
Clear at the top, fully redacted at the bottom. ── */
const REDACTION = [ [], [[41,23]], [[13,27],[55,31]], [[0,36],[43,57]], [[0,100]] ];
const panel = $("s-warning");
panel.href = SITE.weeklyUrl;
panel.setAttribute("aria-label", SITE.warningAria);
panel.innerHTML = `<div class="inner" aria-hidden="true">` + REDACTION.map((bars,r)=>
`<div class="ln">${esc(SITE.warning)}` +
bars.map(([x,w])=>`<i style="left:${x}%;width:${w}%;transition-delay:${r*45}ms"></i>`).join("") +
`</div>`).join("") + `</div>`;
/* ── footer ── */
$("submit").innerHTML =
`<span>${esc(SITE.footerLine)}</span>` +
`<a href="mailto:${esc(SITE.submitEmail)}">${esc(SITE.submitLabel)}</a>`;
</script>
</body>
</html>
